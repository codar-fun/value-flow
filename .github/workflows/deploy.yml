name: Deploy flow-circle

on:
  push:
    branches: [wire-loop-backend]   # 改成你的主部署分支，比如 main
  workflow_dispatch: {}             # 允许在 Actions 页面手动触发

concurrency:
  group: deploy-flow-circle
  cancel-in-progress: false          # 部署不取消，避免和 ginger 的部署锁打架

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiangplus/ginger:latest
      options: --entrypoint ""        # image's ENTRYPOINT is `ginger`; run plain shell steps instead
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for homepod
        run: |
          # ssh(1) resolves "~" via /etc/passwd (-> /root, since the
          # container runs as root) and ignores $HOME. Actions' own $HOME
          # (/github/home) is a different directory, so write to both:
          # ginger's Erlang ssh client honors $HOME, the ssh(1) binary
          # docker buildx shells out to does not.
          for dir in /root/.ssh "$HOME/.ssh"; do
            mkdir -p -m 700 "$dir"
            echo "${{ secrets.HOMEPOD_SSH_KEY }}" > "$dir/id_ed25519"
            chmod 600 "$dir/id_ed25519"
            printf 'Host homepod.sola.day\n  User ubuntu\n  IdentityFile %s/id_ed25519\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile %s/known_hosts\n' "$dir" "$dir" > "$dir/config"
            chmod 600 "$dir/config"
          done
          ssh -o ConnectTimeout=10 homepod.sola.day true

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Deploy with ginger
        env:
          YATCH_TOKEN: ${{ secrets.YATCH_TOKEN }}
        run: ginger deploy
